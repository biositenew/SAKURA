<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sakura — bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════
   Liquid Glass — переиспользуемый эффект «жидкого стекла»
   ═══════════════════════════════════════════════════ */
:root {
    --glass-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.03),
        inset 1.8px 3px 0px -2px rgba(255, 255, 255, 0.27),
        inset -2px -2px 0px -2px rgba(255, 255, 255, 0.24),
        inset -3px -8px 1px -6px rgba(255, 255, 255, 0.18),
        inset -0.3px -1px 4px 0px rgba(0, 0, 0, 0.24),
        inset -1.5px 2.5px 0px -2px rgba(0, 0, 0, 0.4),
        inset 0px 3px 4px -2px rgba(0, 0, 0, 0.4),
        inset 2px -6.5px 1px -4px rgba(0, 0, 0, 0.2),
        0px 1px 5px 0px rgba(0, 0, 0, 0.2),
        0px 6px 16px 0px rgba(0, 0, 0, 0.16);

    --glass-shadow-active:
        inset 0 0 0 1px rgba(255, 255, 255, 0.03),
        inset 1px 1px 0 0 rgba(255, 255, 255, 0.15),
        inset -1px -1px 0 0 rgba(255, 255, 255, 0.1),
        0 2px 4px rgba(0, 0, 0, 0.15);

    --glass-shadow-indicator:
        inset 0 0 0 1px #ffffff08,
        inset 2px 1px 0 -1px #ffffff45,
        inset -1.5px -1px 0 -1px #ffffff3d,
        inset -2px -6px 1px -5px #ffffff2e,
        inset -1px 2px 3px -1px #0006,
        inset 0 -4px 1px -2px #0003,
        0 3px 6px #00000029;

    /* ═══ палитра: чёрно-серая ═══ */
    --bg-0:#08090a;
    --bg-1:#111214;
    --bg-2:#1b1c1f;
    --ink:#f2f2f3;
    --ink-dim:#a6a8ad;
    --ink-faint:#6c6e73;
    --line: rgba(255,255,255,0.07);
}

.glass{ box-shadow: var(--glass-shadow); }
.glass-active{ box-shadow: var(--glass-shadow-active); }
.glass-indicator{ box-shadow: var(--glass-shadow-indicator); }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(70% 55% at 50% -10%, #232427 0%, rgba(35,36,39,0) 60%),
    radial-gradient(90% 70% at 90% 110%, #1a1b1e 0%, rgba(26,27,30,0) 55%),
    linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
  font-family:'Manrope', sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  overflow-x:hidden;
  -webkit-tap-highlight-color: transparent;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

/* ---------- ambient blinking glow field ---------- */
#glow{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.blob{
  position:absolute;
  border-radius:50%;
  filter: blur(60px);
  background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
  mix-blend-mode: screen;
  opacity:0;
  animation: flicker 6s ease-in-out infinite;
}
.blob.b-dark{
  background: radial-gradient(circle, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 70%);
  mix-blend-mode: multiply;
}
@keyframes flicker{
  0%   { opacity:0; }
  4%   { opacity:0.55; }
  7%   { opacity:0.08; }
  10%  { opacity:0.5; }
  14%  { opacity:0.05; }
  40%  { opacity:0.35; }
  55%  { opacity:0.06; }
  75%  { opacity:0.45; }
  100% { opacity:0; }
}
@media (prefers-reduced-motion: reduce){
  .blob{ animation: none; opacity:0.18; }
}

.page{
  position:relative;
  z-index:1;
  width:100%;
  max-width:440px;
  padding:32px 20px 48px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}

.eyebrow{
  font-family:'Unbounded', sans-serif;
  font-size:11px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--ink-dim);
  font-weight:600;
  margin-top:4px;
}
h1{
  font-family:'Unbounded', sans-serif;
  font-weight:800;
  font-size:26px;
  line-height:1.15;
  margin:0;
  text-align:center;
  letter-spacing:-0.01em;
  background:linear-gradient(100deg, #ffffff 10%, #b9babe 60%, #6c6e73 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

/* ---------- photo ---------- */
.photo-card{
  width:100%;
  aspect-ratio: 3 / 4;
  border-radius:28px;
  overflow:hidden;
  position:relative;
  background:var(--bg-2);
}
.photo-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.photo-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  pointer-events:none;
}
.photo-caption{
  position:absolute;
  left:18px;
  bottom:16px;
  font-family:'Unbounded', sans-serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.02em;
  color:#fff;
  z-index:2;
}

/* ---------- links ---------- */
.links{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.link{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:12px 16px;
  border-radius:18px;
  background:rgba(255,255,255,0.045);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  text-decoration:none;
  color:var(--ink);
  transition: transform 0.18s ease, background 0.18s ease;
}
.link:active{ transform: scale(0.98); }
@media (hover:hover){
  .link:hover{
    background:rgba(255,255,255,0.075);
  }
}
.link-icon{
  width:42px;height:42px;flex:0 0 42px;
  border-radius:13px;
  overflow:hidden;
  background:rgba(255,255,255,0.05);
  position:relative;
}
.link-icon .sticker-mount{
  position:absolute;
  inset:7px;
}
.link-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
.link-title{font-weight:700;font-size:14.5px;}
.link-handle{font-size:12.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-arrow{margin-left:auto;flex:0 0 auto;color:var(--ink-faint);}
.link-arrow svg{width:16px;height:16px;}

/* ---------- player ---------- */
.player{
  width:100%;
  padding:16px;
  border-radius:22px;
  background:rgba(255,255,255,0.045);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display:flex;
  align-items:center;
  gap:14px;
}
.play-btn{
  flex:0 0 52px;
  width:52px;height:52px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
}
.play-btn svg{width:20px;height:20px;fill:var(--ink);}
.track-info{flex:1;min-width:0;}
.track-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
.eq{
  display:flex;
  align-items:flex-end;
  gap:3px;
  height:16px;
  margin-top:6px;
}
.eq span{
  width:3px;
  background:var(--ink-dim);
  border-radius:2px;
  height:4px;
  opacity:0.55;
}
body.playing .eq span{ animation: bounce 0.9s ease-in-out infinite; opacity:1; background:var(--ink); }
.eq span:nth-child(1){animation-delay:0s;}
.eq span:nth-child(2){animation-delay:0.15s;}
.eq span:nth-child(3){animation-delay:0.3s;}
.eq span:nth-child(4){animation-delay:0.45s;}
.eq span:nth-child(5){animation-delay:0.2s;}
@keyframes bounce{
  0%,100%{height:4px;}
  50%{height:16px;}
}

.sound-toggle{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.sound-toggle svg{width:17px;height:17px;fill:var(--ink);}

.photo-row{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  margin-top:-6px;
}

footer{
  margin-top:6px;
  font-size:11px;
  color:var(--ink-faint);
  letter-spacing:0.04em;
  text-align:center;
}
</style>
</head>

/* ---------------- sticker icons on links ---------------- */
const stickerAnims = [];
document.querySelectorAll('[data-sticker]').forEach(mount => {
  const anim = lottie.loadAnimation({
    container: mount,
    renderer: 'svg',
    loop: true,
    autoplay: true,
    animationData: STICKER_DATA
  });
  stickerAnims.push(anim);
});

/* ---------------- music player ---------------- */
const audio = document.getElementById('bgAudio');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const trackSub = document.getElementById('trackSub');

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

playBtn.addEventListener('click', () => {
  if (audio.paused){
    audio.play();
  } else {
    audio.pause();
  }
});

audio.addEventListener('play', () => {
  document.body.classList.add('playing');
  playIcon.innerHTML = ICON_PAUSE;
  trackSub.textContent = 'Играет сейчас';
  stickerAnims.forEach((a, i) => setTimeout(() => a.setSpeed(1.6), i * 60));
});
audio.addEventListener('pause', () => {
  document.body.classList.remove('playing');
  playIcon.innerHTML = ICON_PLAY;
  trackSub.textContent = 'Нажми, чтобы включить';
  stickerAnims.forEach(a => a.setSpeed(1));
});
</script>
